<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1837" />
      <stop offset="50%" stop-color="#ff2b45" />
      <stop offset="100%" stop-color="#ff4757" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- App Background with Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  
  <!-- Sparkles & Utensils Icon -->
  <g filter="url(#glow)" transform="translate(106, 106) scale(0.6)">
    <!-- Food Cloche Cover / Burger & Sparkle -->
    <path d="M250 80 C 150 80, 70 160, 60 260 L 440 260 C 430 160, 350 80, 250 80 Z" fill="#ffffff" />
    <circle cx="250" cy="50" r="24" fill="#ffffff" />
    <!-- Plate Base -->
    <rect x="30" y="275" width="440" height="28" rx="14" fill="#ffffff" opacity="0.9" />
    <!-- Fork & Spoon Crest -->
    <path d="M190 340 L 190 440 M 170 340 L 170 390 C 170 410, 210 410, 210 390 L 210 340" stroke="#ffffff" stroke-width="16" stroke-linecap="round" fill="none" />
    <path d="M310 340 L 310 440 M 290 350 C 290 320, 330 320, 330 350 C 330 380, 310 390, 310 410" stroke="#ffffff" stroke-width="16" stroke-linecap="round" fill="none" />
  </g>
  
  <!-- Star Sparkle -->
  <path d="M400 80 Q 400 130, 450 130 Q 400 130, 400 180 Q 400 130, 350 130 Q 400 130, 400 80 Z" fill="#ffd700" />
</svg>
